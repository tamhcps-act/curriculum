ns on developmental practices in education."}],"resources":[],"built":"2026-10-27","stats":{"entries":828,"matched":637,"pairs":1002,"books":6,"topics":142,"subtopics":511}}</script>
<script>
(function(){
const D=JSON.parse(document.getElementById("payload").textContent);
const COVR={"Fully Covered":0,"Partially Covered":1,"Needs Review":2,"Not Covered":3};
const CLS={"Fully Covered":"f","Partially Covered":"p","Needs Review":"p","Not Covered":"n"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let course=D.courses[0], unit=null, node=null, nodes={};

/* ---- build a tree per unit: topic -> subtopic -> deeper entries ---- */
const tree={};
D.entries.forEach(e=>{
  const uk=e.c+"|"+e.u;
  const U=tree[uk]||(tree[uk]={order:[],byTopic:{}});
  if(!U.byTopic[e.t]){U.byTopic[e.t]={name:e.t,self:[],order:[],bySub:{}};U.order.push(e.t);}
  const T=U.byTopic[e.t];
  if(!e.s){T.self.push(e);return;}
  if(!T.bySub[e.s]){T.bySub[e.s]={name:e.s,self:[],deeper:[]};T.order.push(e.s);}
  const S=T.bySub[e.s];
  (e.lv>=2?S.deeper:S.self).push(e);
});
const collect=n=>{
  if(n.kind==="topic"){const T=n.ref;let a=T.self.slice();
    T.order.forEach(s=>{const S=T.bySub[s];a=a.concat(S.self,S.deeper)});return a;}
  if(n.kind==="sub"){const S=n.ref;return S.self.concat(S.deeper);}
  return [n.ref];
};
const best=list=>{let b=9;list.forEach(e=>e.m.forEach(m=>{b=Math.min(b,COVR[m.cov]??9)}));return b;};

/* ---- header ---- */
const cEl=document.getElementById("courses");
cEl.innerHTML=D.courses.map((c,i)=>`<button class="chip c${i+1}" data-c="${esc(c)}" aria-pressed="${c===course}">${esc(c)}</button>`).join("");
cEl.addEventListener("click",ev=>{const b=ev.target.closest(".chip");if(!b)return;
  course=b.dataset.c;unit=null;node=null;document.getElementById("q").value="";render();});

/* ---- units ---- */
function renderUnits(){
  const us=D.units.filter(u=>u.c===course);
  document.getElementById("ucount").textContent=us.length+" units";
  document.getElementById("units").innerHTML=us.map(u=>{
    const U=tree[u.c+"|"+u.u]; let tot=0,cov=0;
    if(U)U.order.forEach(t=>{const all=collect({kind:"topic",ref:U.byTopic[t]});
      tot+=all.length;cov+=all.filter(e=>e.m.length).length;});
    const pct=tot?Math.round(100*cov/tot):0;
    return `<button class="unit" data-u="${u.u}" aria-current="${unit===u.u}">
      <b>U${u.u}</b><span>${esc(u.name)}</span>
      <i class="meter" title="${pct}% of entries have a chapter"><i style="width:${pct}%"></i></i></button>`;
  }).join("");
}
document.getElementById("units").addEventListener("click",ev=>{
  const b=ev.target.closest(".unit");if(!b)return;
  unit=+b.dataset.u;node=null;render();
  if(window.matchMedia("(max-width:860px)").matches)
    document.getElementById("treepanel").scrollIntoView({behavior:"smooth",block:"start"});
});

/* ---- topic tree ---- */
function renderTree(){
  const p=document.getElementById("treepanel");
  if(unit===null){p.hidden=true;return;}
  p.hidden=false;
  const U=tree[course+"|"+unit];
  if(!U){document.getElementById("tree").innerHTML='<div class="empty">No topics.</div>';return;}
  let n=0,html="";
  const row=(nd,cls,label,count)=>{
    const b=best(collect(nd));const d=b===0?"f":b===1?"p":b<9?"p":"n";
    const id=nd.key;
    return `<button class="node ${cls}" data-k="${esc(id)}" aria-current="${node&&node.key===id}">
      <i class="dot ${d}"></i><span class="txt">${esc(label)}</span>${count?`<span class="n">${count}</span>`:""}</button>`;
  };
  U.order.forEach(tn=>{
    const T=U.byTopic[tn];n++;
    const tNode={kind:"topic",ref:T,key:course+"|"+unit+"|T::"+tn,label:tn};
    nodes[tNode.key]=tNode;
    const chapters=chapterList(collect(tNode)).length;
    html+=row(tNode,"lv0",tn,chapters||"");
    T.order.forEach(sn=>{
      const S=T.bySub[sn];n++;
      const sNode={kind:"sub",ref:S,key:course+"|"+unit+"|S::"+tn+"::"+sn,label:sn,topic:tn};
      nodes[sNode.key]=sNode;
      html+=row(sNode,"lv1",sn,"");
      S.deeper.forEach(e=>{n++;
        const eNode={kind:"entry",ref:e,key:course+"|"+unit+"|E::"+tn+"::"+sn+"::"+e.e,label:e.e,topic:tn,sub:sn};
        nodes[eNode.key]=eNode;
        html+=row(eNode,"lv"+Math.min(e.lv,3),e.e,"");});
    });
  });
  document.getElementById("tcount").textContent=n+" entries";
  document.getElementById("tree").innerHTML=html;
}

document.getElementById("tree").addEventListener("click",ev=>{
  const b=ev.target.closest(".node");if(!b)return;
  node=nodes[b.dataset.k];renderTree();renderRes();
  if(window.matchMedia("(max-width:860px)").matches)
    document.getElementById("res").scrollIntoView({behavior:"smooth",block:"start"});
});

/* ---- chapters for a set of entries ---- */
function chapterList(list){
  const by={};
  list.forEach(e=>e.m.forEach(m=>{
    const k=m.b+"||"+m.ch;
    const o=by[k]||(by[k]={b:m.b,ch:m.ch,ct:m.ct,cov:m.cov,ev:[],forr:new Set()});
    if((COVR[m.cov]??9)<(COVR[o.cov]??9)){o.cov=m.cov;}
    if(!o.ev.includes(m.ev))o.ev.push(m.ev);
    o.forr.add(e.e);
  }));
  return Object.values(by).sort((a,b)=>(COVR[a.cov]-COVR[b.cov])||b.forr.size-a.forr.size||a.b.localeCompare(b.b));
}

/* ---- results ---- */
function renderRes(){
  const R=document.getElementById("res");
  if(unit===null){
    const us=D.units.filter(u=>u.c===course);
    R.innerHTML=`<div><div class="crumb">${esc(course)}</div>
      <h2 class="title">Pick a unit to begin</h2>
      <p class="sub">Choose one of the ${us.length} units, then a topic, and the chapters that teach it appear here.</p></div>
      <div class="stds"><h4>What this covers</h4>
      <div class="std"><b>${D.stats.topics}</b><span>curriculum topics across the three courses, with ${D.stats.subtopics} subtopics beneath them</span></div>
      <div class="std"><b>${D.stats.books}</b><span>textbooks aligned from their tables of contents</span></div>
      <div class="std"><b>${D.stats.pairs}</b><span>topic-to-chapter alignments, each citing the chapter heading it came from</span></div></div>`;
    return;
  }
  const u=D.units.find(x=>x.c===course&&x.u===unit);
  if(!node){
    const U=tree[course+"|"+unit];
    const all=U?U.order.reduce((a,t)=>a.concat(collect({kind:"topic",ref:U.byTopic[t]})),[]):[];
    const chs=chapterList(all);
    R.innerHTML=`<div><div class="crumb">${esc(course)} &rsaquo; Unit ${unit}</div>
      <h2 class="title">${esc(u.name)}</h2>
      <p class="sub">${all.length} entries &middot; ${chs.length} chapters across the aligned textbooks. Pick a topic for the chapters that teach it.</p></div>
      ${stdBlock(u)}${booksBlock(chs,"Chapters used anywhere in this unit")}`;
    return;
  }
  const list=collect(node), chs=chapterList(list);
  const crumbs=[course,"Unit "+unit,u.name];
  if(node.kind!=="topic")crumbs.push(node.topic);
  if(node.kind==="entry"&&node.sub)crumbs.push(node.sub);
  R.innerHTML=`<div><div class="crumb">${crumbs.map(esc).join(" &rsaquo; ")}</div>
    <h2 class="title">${esc(node.label)}</h2>
    <p class="sub">${list.length===1?"1 curriculum entry":list.length+" curriculum entries"} &middot;
      ${chs.length?chs.length+" chapter"+(chs.length>1?"s":""):"no chapter coverage"}</p></div>
    ${chs.length?booksBlock(chs,"Chapters you can teach this from")
      :`<div class="gap"><b>No textbook chapter covers this yet</b>
        <span>None of the ${D.stats.books} aligned tables of contents has a section matching this topic. This is a known gap, not a missing record &mdash; plan a teacher-created resource, or add a textbook whose contents cover it.</span></div>`}
    ${stdBlock(u)}`;
}
function stdBlock(u){
  if(!u.stds.length)return"";
  return `<div class="stds"><h4>Standards this unit addresses</h4>
    ${u.stds.map(s=>`<div class="std"><b>${esc(s.id)}</b><span>${esc(s.d)}</span></div>`).join("")}</div>`;
}
function booksBlock(chs,heading){
  const byBook={};chs.forEach(c=>(byBook[c.b]||(byBook[c.b]=[])).push(c));
  return `<div style="display:flex;flex-direction:column;gap:12px">
    <div class="crumb" style="margin-bottom:-4px">${esc(heading)}</div>
    ${Object.keys(byBook).map(b=>{
      const rows=byBook[b];
      return `<section class="book"><div class="bhead"><h3>${esc(b)}</h3>
        <span class="pill ${CLS[rows[0].cov]}">${esc(rows[0].cov)}</span></div>
        ${rows.map(c=>`<div class="ch"><span class="chno">Ch ${esc(c.ch)}</span><div class="chbody">
          <div class="t">${esc(c.ct)}</div>
          <div class="ev">Matched on <code>${esc(c.ev[0])}</code>${c.ev.length>1?` and ${c.ev.length-1} more`:""}</div>
          ${c.forr.size>1?`<div class="for">Covers ${c.forr.size} entries in this selection</div>`:""}
        </div><span class="pill ${CLS[c.cov]}">${esc(c.cov)}</span></div>`).join("")}
      </section>`;}).join("")}</div>`;
}

/* ---- search ---- */
const q=document.getElementById("q");
q.addEventListener("input",()=>{
  const v=q.value.trim().toLowerCase();
  if(!v){render();return;}
  const hits=D.entries.filter(e=>e.e.toLowerCase().includes(v)||e.t.toLowerCase().includes(v)||e.s.toLowerCase().includes(v)).slice(0,60);
  document.getElementById("res").innerHTML=
    `<div><div class="crumb">Search</div><h2 class="title">${hits.length} match${hits.length===1?"":"es"} for &ldquo;${esc(q.value.trim())}&rdquo;</h2></div>`+
    (hits.length?`<div class="hits">${hits.map((e,i)=>`<button class="hit" data-i="${i}">
      <span class="w">${esc(e.c)} &rsaquo; Unit ${e.u}${e.s?" &rsaquo; "+esc(e.t):""}</span>
      <span class="e" style="display:block">${esc(e.e)}</span>
      <span class="w">${e.m.length?e.m.length+" chapter"+(e.m.length>1?"s":""):"no chapter coverage"}</span></button>`).join("")}</div>`
     :`<div class="empty">Nothing matches that. Try a shorter word.</div>`);
  document.getElementById("res").querySelectorAll(".hit").forEach(btn=>btn.addEventListener("click",()=>{
    const e=hits[+btn.dataset.i];
    course=e.c;unit=e.u;q.value="";
    renderUnits();renderTree();
    const key=e.c+"|"+e.u+"|"+(e.s?(e.lv>=2?"E::"+e.t+"::"+e.s+"::"+e.e:"S::"+e.t+"::"+e.s):"T::"+e.t);
    node=nodes[key]||null;renderTree();renderRes();
    document.getElementById("courses").querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.c===course));
  }));
});

function render(){renderUnits();renderTree();renderRes();}
document.getElementById("built").textContent="Built "+D.built+" from the TAM I, II and III course outlines and six submitted tables of contents.";
document.getElementById("counts").textContent=D.stats.matched+" of "+D.stats.entries+" curriculum entries have at least one chapter.";
render();
})();
</script>

</body>
</html>
